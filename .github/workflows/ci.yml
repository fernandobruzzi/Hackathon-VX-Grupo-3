name: CI

on:
  pull_request:
    branches: [homologacao, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# PRs de trabalho rodam estilo. A promoção também roda testes e imagens (docs/devops.md).
# CI descartável: uma execução nova do mesmo PR cancela a anterior, que testava um
# estado já superado. Este workflow não publica nem migra nada fora do runner. Um job de deploy
# ou migração real não pode entrar aqui: precisa de workflow e grupo próprios, sem cancelamento,
# além do lock S3 dos scripts de deploy. Decisão e medições em docs/devops.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    if: ${{ github.base_ref == 'homologacao' || (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run format:check
        working-directory: front

  python:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [mcp, api]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv sync --locked
      - run: uv run pytest

  back-main:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/back-tests.yml
    with:
      shard: main

  back-sanitize:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/back-tests.yml
    with:
      shard: sanitize

  back-evaluation:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/back-tests.yml
    with:
      shard: evaluation

  back-experiment:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/back-tests.yml
    with:
      shard: experiment

  back-experiment-seed:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/back-tests.yml
    with:
      shard: experiment-seed

  python-back:
    name: python (back)
    if: ${{ always() && ((github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao')) }}
    needs: [back-main, back-sanitize, back-evaluation, back-experiment, back-experiment-seed]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success success"

  database-api-main:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: api
      shard: main

  database-api-demo:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: api
      shard: demo

  database-api-batch:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: api
      shard: batch

  database-api-superseded:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: api
      shard: superseded

  database-api-batch-job:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: api
      shard: batch-job

  database-api-sanitize:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: api
      shard: sanitize

  database-mcp-main:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: mcp
      shard: main

  database-mcp-acceptance:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: mcp
      shard: acceptance

  database-mcp-search:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: mcp
      shard: search

  database-mcp-index:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    uses: ./.github/workflows/database-tests.yml
    with:
      module: mcp
      shard: index

  database:
    if: ${{ always() && ((github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao')) }}
    needs: [database-api-main, database-api-demo, database-api-batch, database-api-superseded, database-api-batch-job, database-api-sanitize, database-mcp-main, database-mcp-acceptance, database-mcp-search, database-mcp-index]
    runs-on: ubuntu-latest
    steps:
      - name: Require every PostgreSQL shard to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success success success success success success success"

  front:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm test
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: front/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/src/**', 'front/public/**', 'front/next.config.*', 'front/tsconfig.json', 'front/postcss.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}-
      - run: npm run build

  images:
    if: ${{ (github.base_ref == 'main' && github.event.pull_request.head.ref == 'homologacao' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/homologacao') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: vx-ci-${{ github.run_id }}-${{ github.run_attempt }}
      APP_ENV: local
      LOCAL_TEST_SESSION: "true"
      DB_PORT: "15432"
      API_BIND_PORT: "18000"
      APP_ORIGIN: http://127.0.0.1:18000
      AGENT_INTERNAL_TOKEN_SECRET: ci_only_internal_token_secret_with_32_bytes
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: |
            ${{ env.COMPOSE_PROJECT_NAME }}-api:latest
            ${{ env.COMPOSE_PROJECT_NAME }}-migrate:latest
            ${{ env.COMPOSE_PROJECT_NAME }}-bootstrap:latest
            ${{ env.COMPOSE_PROJECT_NAME }}-demo:latest
          load: true
          cache-from: type=gha,scope=image-api
          cache-to: type=gha,scope=image-api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-agent:latest
          load: true
          cache-from: type=gha,scope=image-agent
          cache-to: type=gha,scope=image-agent,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: batch
          tags: |
            ${{ env.COMPOSE_PROJECT_NAME }}-batch:latest
            ${{ env.COMPOSE_PROJECT_NAME }}-index:latest
          load: true
          cache-from: type=gha,scope=image-batch
          cache-to: type=gha,scope=image-batch,mode=max
      - name: Check packaged references without bind mounts
        run: |
          docker run --rm "$COMPOSE_PROJECT_NAME-agent" python -c 'import os; from domain.pdm_loader import load_pdm; assert load_pdm(os.environ["PDM_WORKBOOK_PATH"]).classes'
          docker run --rm "$COMPOSE_PROJECT_NAME-batch" vx-back --help
          docker run --rm "$COMPOSE_PROJECT_NAME-api" python -c 'import ssl; assert ssl.create_default_context(cafile="/app/certs/rds-global-bundle.pem").cert_store_stats()["x509_ca"] > 0'
      - name: Check packaged evaluation cohorts without AWS or database
        run: |
          docker run --rm --network none --read-only "$COMPOSE_PROJECT_NAME-batch" vx-back sanitization-evaluate /app/data/desafio01/01_base_materiais.csv --pdm-workbook /app/data/desafio01/03_padrao_cadastro_PDM.xlsx > "$RUNNER_TEMP/sanitization-evaluation.json"
          python3 -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"sanitization-evaluation.json"))); assert r["evaluation_kind"] == "DEVELOPMENT_EVALUATION"; assert not r["independent_review"] and not r["authorizes_merge"]; assert r["groups"]["counts"]["cases"] == 40'
      - name: Prepare the deterministic HTTP smoke kit
        run: |
          python3 scripts/ci_smoke_kit.py data/desafio01 "$RUNNER_TEMP/vx-smoke-data/desafio01"
          echo "CI_SMOKE_DATA_DIR=$RUNNER_TEMP/vx-smoke-data" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=docker-compose.yml:.github/compose-smoke.yml" >> "$GITHUB_ENV"
      - name: Start isolated Compose stack, real search index included
        run: docker compose up -d --no-build --wait --wait-timeout 300 api
      - name: Verify frontend and real MCP turn
        run: scripts/smoke_test.sh http://127.0.0.1:18000 --mode local
      - name: Load deterministic demo in isolated Compose project
        env:
          DEMO_MODE: "true"
        run: docker compose --profile demo run --rm --no-deps --pull never demo reset --confirm vx_materiais
      - name: Verify complete local flow
        run: scripts/smoke_test.sh http://127.0.0.1:18000 --mode flow
      - name: Measure bounded Agent concurrency and cancellation cleanup
        run: docker compose exec -T agent python - --requests 8 < scripts/measure_agent.py
      - name: Logs on failure or cancellation
        if: failure() || cancelled()
        run: docker compose logs --no-color --tail=100
      - name: Remove isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
