name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run format:check
        working-directory: front

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [back, mcp, api]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_user"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://migration_user:ci_only@localhost:5432/vx_materials_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run pytest
        working-directory: mcp

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, agent, batch]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target ${{ matrix.target }} --tag vx-${{ matrix.target }} .
      - if: matrix.target == 'batch'
        run: docker run --rm vx-batch
