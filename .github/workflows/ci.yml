name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run format:check
        working-directory: front
      - run: node --test scripts/tests/*.test.cjs

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [back, mcp, api]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv sync --locked
      - run: uv run pytest
      - if: matrix.module == 'back'
        run: uv run --package vx-materials-back python -m unittest discover -s scripts/tests -p 'test_aws.py'
        working-directory: .

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vx_migration_check
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_user"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://migration_user:ci_only@localhost:5432/vx_materials_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv sync --locked
      - name: Check installed migration command twice
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://migration_user:ci_only@localhost:5432/vx_migration_check
        run: |
          uv run --locked vx-db upgrade
          uv run --locked vx-db upgrade
      - run: uv run pytest
      - run: uv run pytest
        working-directory: mcp

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm test
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: front/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/src/**', 'front/public/**', 'front/next.config.*', 'front/tsconfig.json', 'front/postcss.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}-
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: vx-ci
      APP_ENV: local
      LOCAL_TEST_SESSION: "true"
      DB_PORT: "15432"
      API_BIND_PORT: "18000"
      APP_ORIGIN: http://127.0.0.1:18000
      AGENT_INTERNAL_TOKEN_SECRET: ci_only_internal_token_secret_with_32_bytes
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: |
            vx-ci-api:latest
            vx-ci-migrate:latest
            vx-ci-bootstrap:latest
          load: true
          cache-from: type=gha,scope=image-api
          cache-to: type=gha,scope=image-api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          tags: vx-ci-agent:latest
          load: true
          cache-from: type=gha,scope=image-agent
          cache-to: type=gha,scope=image-agent,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: batch
          tags: vx-ci-batch:latest
          load: true
          cache-from: type=gha,scope=image-batch
          cache-to: type=gha,scope=image-batch,mode=max
      - name: Check packaged references without bind mounts
        run: |
          docker run --rm vx-ci-agent python -c 'import os; from domain.pdm_loader import load_pdm; assert load_pdm(os.environ["PDM_WORKBOOK_PATH"]).classes'
          docker run --rm vx-ci-batch vx-back --help
          docker run --rm vx-ci-api python -c 'import ssl; assert ssl.create_default_context(cafile="/app/certs/rds-global-bundle.pem").cert_store_stats()["x509_ca"] > 0'
      - name: Start isolated Compose stack
        run: docker compose up -d --no-build --wait --wait-timeout 180 api
      - name: Build real search index
        run: docker compose run --rm --no-deps batch vx-back index
      - name: Verify frontend and real MCP turn
        run: scripts/smoke_test.sh http://127.0.0.1:18000 --mode local
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
