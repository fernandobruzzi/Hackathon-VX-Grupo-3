name: PostgreSQL tests

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      shard:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vx_migration_check
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_user"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://migration_user:ci_only@localhost:5432/vx_materials_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv sync --locked
      - name: Check installed migration command twice
        if: inputs.module == 'api' && inputs.shard == 'demo'
        working-directory: api
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://migration_user:ci_only@localhost:5432/vx_migration_check
        run: |
          uv run --locked vx-db upgrade
          uv run --locked vx-db upgrade
      - name: Run PostgreSQL suite
        env:
          MODULE: ${{ inputs.module }}
          SHARD: ${{ inputs.shard }}
        run: python3 scripts/ci_pytest.py "$MODULE" "$SHARD"
