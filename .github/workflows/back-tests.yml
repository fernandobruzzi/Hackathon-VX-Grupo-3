name: Back tests

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - run: uv sync --locked --package vx-materials-back
      - run: python3 scripts/ci_pytest.py back "${{ inputs.shard }}"
      - if: inputs.shard == 'main'
        run: uv run --package vx-materials-back python -m unittest discover -s scripts/tests -p 'test_*.py'
      - if: inputs.shard == 'main'
        name: Validate offline EC2 Compose definition
        run: |
          uv run --package vx-materials-back python scripts/ec2_deploy.py --config deployment/aws.example.json --host 203.0.113.10.nip.io --render-dir "$RUNNER_TEMP/vx-ec2"
          docker compose -f "$RUNNER_TEMP/vx-ec2/compose.json" config --no-env-resolution --quiet
