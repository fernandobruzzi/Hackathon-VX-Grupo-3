[project]
name = "vx-materials-mcp"
version = "0.1.0"
description = "Servidor MCP e chatbot do cadastro de materiais"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2.3,<3",
    "pyjwt>=2.10",
    "uvicorn>=0.34",
    "vx-materials-back",
]

[project.scripts]
vx-agent = "vx_materials_mcp.app:main"
vx-mcp-server = "vx_materials_mcp.server:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8", "vx-materials-api"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
vx-materials-api = { workspace = true }
vx-materials-back = { workspace = true }

[tool.setuptools.packages.find]
include = ["vx_materials_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
