[project]
name = "vx-materials-api"
version = "0.1.0"
description = "API do cadastro de materiais, que tambem serve o build do front"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn>=0.34",
    "vx-materials-back",
]

[project.scripts]
vx-api = "vx_materials_api.main:main"
vx-db = "vx_materials_api.db.cli:main"
vx-batch-job = "vx_materials_api.batch_job_cli:main"
vx-bootstrap = "vx_materials_api.bootstrap:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema[format]>=4.23",
    "openapi-spec-validator>=0.7",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vx_materials_api*"]

[tool.setuptools.package-data]
"vx_materials_api.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
vx-materials-back = { workspace = true }
