[tool.uv.workspace]
members = ["back", "mcp", "api"]

[dependency-groups]
dev = ["pre-commit>=4", "ruff>=0.11"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["clients", "cli", "domain", "enrichment", "matching", "pipelines", "repositories", "vx_materials_api", "vx_materials_mcp"]
