[tool.uv.workspace]
members = ["back", "mcp", "api"]

[dependency-groups]
dev = ["pre-commit>=4", "ruff>=0.11"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migrações geradas ficam como o Alembic escreveu.
"api/vx_materials_api/db/migrations/versions/*" = ["E501", "I"]

[tool.ruff.lint.isort]
known-first-party = ["clients", "cli", "domain", "enrichment", "pipelines", "repositories", "vx_materials_api", "vx_materials_mcp"]
