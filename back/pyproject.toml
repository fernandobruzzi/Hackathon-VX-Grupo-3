[project]
name = "vx-materials-back"
version = "0.1.0"
description = "Pipeline batch e regras de dominio do cadastro de materiais"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
vx-back = "cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["clients*", "domain*", "enrichment*", "matching*", "pipelines*", "repositories*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
