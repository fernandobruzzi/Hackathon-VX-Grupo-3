[project]
name = "vx-materials-back"
version = "0.1.0"
description = "Pipeline batch e regras de dominio do cadastro de materiais"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pypdf>=6.21.4",
    "sqlalchemy>=2.0",
]

[project.scripts]
vx-back = "cli:main"

[dependency-groups]
dev = [
    "moto[s3]>=5",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["clients*", "domain*", "enrichment*", "matching*", "pipelines*", "repositories*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"pipelines.evaluation_data" = ["*.json"]
