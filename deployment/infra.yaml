AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Pre-requisitos do deploy ECS Express (#6): roles IAM, security groups e RDS
  PostgreSQL privado. ECR, bucket, log group e cluster continuam em
  bootstrap_aws.sh; segredos de aplicacao em aws_secrets.py.

Parameters:
  Name:
    Type: String
    Default: vx-grupo3
    AllowedPattern: "[a-z][a-z0-9-]{2,31}"
    Description: Mesmo valor de "name" em aws.local.json.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets da VPC usadas pelo RDS (pelo menos duas AZs).
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbEngineVersion:
    Type: String
    Default: "16.15"
    Description: Mesma major do Postgres local (pgvector/pgvector:pg16).
  DbAllocatedStorage:
    Type: Number
    Default: 20
  PublicOrigin:
    Type: String
    Default: ""
    AllowedPattern: "^(https://[a-z0-9.-]+)?$"
    Description: >-
      Origem HTTPS observada no primeiro deploy, sem barra final. Vazio mantem o
      Cognito desligado; preenchida, cria User Pool, grupos, dominio e app client.

  CustomDomain:
    Type: String
    Default: ""
    AllowedPattern: "^([a-z0-9-]+\\.)*[a-z0-9-]*$"
    Description: >-
      Dominio proprio (ex. vx.cerne.pro). Preenchido junto com ExpressEndpoint,
      cria certificado ACM validado por DNS e CloudFront na frente do Express.
  ExpressEndpoint:
    Type: String
    Default: ""
    Description: Host do endpoint HTTPS do Express, sem https:// (origem do CloudFront).

  GitHubRepository:
    Type: String
    Default: ""
    AllowedPattern: "^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?$"
    Description: >-
      owner/repo autorizado a publicar por OIDC a partir de main. Vazio mantem o
      deploy somente manual.

Conditions:
  HasGitHubDeploy: !Not [!Equals [!Ref GitHubRepository, ""]]
  HasPublicOrigin: !Not [!Equals [!Ref PublicOrigin, ""]]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomain, ""]]
    - !Not [!Equals [!Ref ExpressEndpoint, ""]]

Resources:
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Sem ingresso: o Express anexa as tasks um SG proprio que libera somente 8000
      # a partir do balanceador; o Agent (8001) continua inacessivel.
      GroupDescription: !Sub "${Name} tasks (web, batch, migracao); sem ingresso publico"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Saida para ECR, Secrets Manager, S3, Bedrock e RDS
      Tags:
        - { Key: Name, Value: !Sub "${Name}-tasks" }
        - { Key: vx-project, Value: !Ref Name }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Name} RDS; 5432 somente a partir das tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: Tasks ECS
      Tags:
        - { Key: Name, Value: !Sub "${Name}-rds" }
        - { Key: vx-project, Value: !Ref Name }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${Name} RDS"
      SubnetIds: !Ref SubnetIds
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Ref Name
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MasterUsername: vx_master
      # Senha gerada e guardada pelo RDS no Secrets Manager; nunca passa pelo template.
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/*"
                  - !GetAtt Database.MasterUserSecret.SecretArn
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-web"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Deny
                Action: "s3:*"
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/locks/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}"
        - PolicyName: batch-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Name}-batch:*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${Name}"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${Name}-batch"
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }
        - PolicyName: embeddings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  BatchTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-batch"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Deny
                Action: "s3:*"
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/locks/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}"
        - PolicyName: embeddings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  ExpressInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-express-infrastructure"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
      Policies:
        # A politica gerenciada nao cobre estas chamadas, que o Express faz com esta role
        # (AccessDenied no CloudTrail e deployment parado com zero tasks).
        - PolicyName: express-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Name}/*"
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: HasPublicOrigin
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Ref Name
      # Contas criadas por administrador; ninguem se cadastra sozinho.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        vx-project: !Ref Name

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasPublicOrigin
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "${Name}-${AWS::AccountId}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasPublicOrigin
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Name}-web"
      # Cliente publico com PKCE S256 no BFF; sem segredo para nao duplicar configuracao.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Sub "${PublicOrigin}/auth/callback/"]
      # Destino do /logout do Hosted UI depois que a API revoga a sessao.
      LogoutURLs: [!Sub "${PublicOrigin}/login/"]
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  SolicitanteGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: HasPublicOrigin
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ROLE_SOLICITANTE

  GovernancaGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: HasPublicOrigin
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ROLE_GOVERNANCA_PDM

  FiscalGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: HasPublicOrigin
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ROLE_AUDITOR_FISCAL

  # O Express nao aceita dominio proprio e reverte mudancas no balanceador que gerencia.
  # O CloudFront termina o TLS do dominio e repassa tudo ao Express sem cache.
  CustomDomainCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomain
      ValidationMethod: DNS
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  CustomDomainDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasCustomDomain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${Name} ${CustomDomain} -> Express"
        Aliases: [!Ref CustomDomain]
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CustomDomainCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: express
            DomainName: !Ref ExpressEndpoint
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: express
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingDisabled: respostas autenticadas e cookies nunca ficam em cache.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader: repassa cookies, query e Origin; o Host vira o do Express.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  # Deploy automatico: o GitHub troca o token OIDC do workflow por esta role. Sem chaves
  # de longa duracao, e somente pushes em main deste repositorio podem assumi-la.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: HasGitHubDeploy
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubDeploy
    Properties:
      RoleName: !Sub "${Name}-github-deploy"
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepository}:ref:refs/heads/main"
      Policies:
        - PolicyName: images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Name}-*"
        - PolicyName: ecs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Sem permissao por recurso nestas acoes de leitura/registro.
              - Effect: Allow
                Action:
                  - ecs:DescribeServiceDeployments
                  - ecs:DescribeServiceRevisions
                  - ecs:DescribeTaskDefinition
                  - ecs:ListServiceDeployments
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Name}-*:*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${Name}"
              - Effect: Allow
                Action: [ecs:DescribeTasks, ecs:StopTask]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${Name}/*"
              - Effect: Allow
                Action:
                  - ecs:CreateExpressGatewayService
                  - ecs:DescribeExpressGatewayService
                  - ecs:DescribeServices
                  - ecs:TagResource
                  - ecs:UpdateExpressGatewayService
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Name}/*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${Name}"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt WebTaskRole.Arn
                  - !GetAtt BatchTaskRole.Arn
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExpressInfrastructureRole.Arn
                Condition:
                  StringEquals: { "iam:PassedToService": ecs.amazonaws.com }
        - PolicyName: deploy-checks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lock condicional do deploy; a aplicacao nao recebe este prefixo.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/locks/${Name}/*"
              # O deploy confere URLs, senhas e chave de sessao em memoria, sem imprimir.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/api-database-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/agent-database-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/batch-database-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/migration-database-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/database-passwords-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/internal-token-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/session-encryption-*"
              - Effect: Allow
                Action: rds:DescribeDBInstances
                Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${Name}"
              - Effect: Allow
                Action: cognito-idp:DescribeUserPoolClient
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
      Tags:
        - { Key: vx-project, Value: !Ref Name }

Outputs:
  GitHubDeployRoleArn:
    Condition: HasGitHubDeploy
    Value: !GetAtt GitHubDeployRole.Arn
  CustomDomainTarget:
    Condition: HasCustomDomain
    Description: Valor do CNAME do dominio proprio.
    Value: !GetAtt CustomDomainDistribution.DomainName
  CognitoUserPoolId:
    Condition: HasPublicOrigin
    Value: !Ref UserPool
  CognitoAppClientId:
    Condition: HasPublicOrigin
    Value: !Ref UserPoolClient
  CognitoDomain:
    Condition: HasPublicOrigin
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  DatabaseInstance:
    Value: !Ref Database
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseMasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  WebTaskRoleArn:
    Value: !GetAtt WebTaskRole.Arn
  BatchTaskRoleArn:
    Value: !GetAtt BatchTaskRole.Arn
  InfrastructureRoleArn:
    Value: !GetAtt ExpressInfrastructureRole.Arn
  Bucket:
    Value: !Sub "${Name}-${AWS::AccountId}-${AWS::Region}"
