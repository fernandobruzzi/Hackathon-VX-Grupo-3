AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Pre-requisitos do deploy ECS Express (#6): roles IAM, security groups e RDS
  PostgreSQL privado. ECR, bucket, log group e cluster continuam em
  bootstrap_aws.sh; segredos de aplicacao em aws_secrets.py.

Parameters:
  Name:
    Type: String
    Default: vx-grupo3
    AllowedPattern: "[a-z][a-z0-9-]{2,31}"
    Description: Mesmo valor de "name" em aws.local.json.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets da VPC usadas pelo RDS (pelo menos duas AZs).
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbEngineVersion:
    Type: String
    Default: "16.15"
    Description: Mesma major do Postgres local (pgvector/pgvector:pg16).
  DbAllocatedStorage:
    Type: Number
    Default: 20

Resources:
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Sem ingresso: o Express anexa as tasks um SG proprio que libera somente 8000
      # a partir do balanceador; o Agent (8001) continua inacessivel.
      GroupDescription: !Sub "${Name} tasks (web, batch, migracao); sem ingresso publico"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Saida para ECR, Secrets Manager, S3, Bedrock e RDS
      Tags:
        - { Key: Name, Value: !Sub "${Name}-tasks" }
        - { Key: vx-project, Value: !Ref Name }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Name} RDS; 5432 somente a partir das tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: Tasks ECS
      Tags:
        - { Key: Name, Value: !Sub "${Name}-rds" }
        - { Key: vx-project, Value: !Ref Name }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${Name} RDS"
      SubnetIds: !Ref SubnetIds
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Ref Name
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MasterUsername: vx_master
      # Senha gerada e guardada pelo RDS no Secrets Manager; nunca passa pelo template.
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Name}/*"
                  - !GetAtt Database.MasterUserSecret.SecretArn
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-web"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Deny
                Action: "s3:*"
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/locks/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}"
        - PolicyName: batch-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Name}-batch:*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${Name}"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${Name}-batch"
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }
        - PolicyName: embeddings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  BatchTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-batch"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Deny
                Action: "s3:*"
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}/locks/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${Name}-${AWS::AccountId}-${AWS::Region}"
        - PolicyName: embeddings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      Tags:
        - { Key: vx-project, Value: !Ref Name }

  ExpressInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-express-infrastructure"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
      Policies:
        # A politica gerenciada nao cobre estas chamadas, que o Express faz com esta role
        # (AccessDenied no CloudTrail e deployment parado com zero tasks).
        - PolicyName: express-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Name}/*"
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
      Tags:
        - { Key: vx-project, Value: !Ref Name }

Outputs:
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  DatabaseInstance:
    Value: !Ref Database
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseMasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  WebTaskRoleArn:
    Value: !GetAtt WebTaskRole.Arn
  BatchTaskRoleArn:
    Value: !GetAtt BatchTaskRole.Arn
  InfrastructureRoleArn:
    Value: !GetAtt ExpressInfrastructureRole.Arn
  Bucket:
    Value: !Sub "${Name}-${AWS::AccountId}-${AWS::Region}"
