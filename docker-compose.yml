# Ambiente local. O Plano B reaproveita as imagens e troca o db pelo RDS. Ver #29.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vx_materiais}
      POSTGRES_USER: migration_user
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:-local_only_migration}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_user -d ${POSTGRES_DB:-vx_materiais}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica as migrações e define as senhas locais antes de a API subir.
  migrate:
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://migration_user:${MIGRATION_DB_PASSWORD:-local_only_migration}@db:5432/${POSTGRES_DB:-vx_materiais}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-local_only_api}
      BATCH_DB_PASSWORD: ${BATCH_DB_PASSWORD:-local_only_batch}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-local_only_mcp}
    command: ["sh", "-c", "vx-db upgrade && vx-db set-passwords"]
    depends_on:
      db:
        condition: service_healthy

  # Carrega o kit de dados. Pode repetir: nada é duplicado.
  bootstrap:
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
    environment:
      DATABASE_URL: postgresql+psycopg://api_user:${API_DB_PASSWORD:-local_only_api}@db:5432/${POSTGRES_DB:-vx_materiais}
      DATA_DIR: /data/desafio01
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /storage
      S3_BUCKET: ${S3_BUCKET:-}
    command: ["vx-bootstrap"]
    volumes:
      - ./data:/data:ro
      - storage-data:/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  # O indexador existente acompanha revisões do cadastro com a credencial batch, sem escrever na master.
  # O primeiro ciclo libera o Agent; depois, publicações e aprovações são reindexadas automaticamente.
  index:
    init: true
    build:
      context: .
      target: batch
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://batch_user:${BATCH_DB_PASSWORD:-local_only_batch}@db:5432/${POSTGRES_DB:-vx_materiais}
      PDM_WORKBOOK_PATH: /data/desafio01/03_padrao_cadastro_PDM.xlsx
    command: ["vx-back", "index", "--watch"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/vx-index-ready').is_file()"]
      interval: 2s
      timeout: 3s
      retries: 150
    volumes:
      - ./data:/data:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  api:
    init: true
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_URL: http://agent:8001
      AGENT_INTERNAL_TOKEN_SECRET: ${AGENT_INTERNAL_TOKEN_SECRET:-local_only_agent_internal_token_secret}
      # Contas locais com cookie opaco; nunca ativar no deploy.
      APP_ENV: ${APP_ENV:-local}
      LOCAL_TEST_SESSION: ${LOCAL_TEST_SESSION:-true}
      ENABLE_LOCAL_TEST_SESSIONS: ${ENABLE_LOCAL_TEST_SESSIONS:-false}
      AUTH_BACKEND: ${AUTH_BACKEND:-disabled}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${API_BIND_PORT:-8000}}
      DATABASE_URL: postgresql+psycopg://api_user:${API_DB_PASSWORD:-local_only_api}@db:5432/${POSTGRES_DB:-vx_materiais}
      AUTOMATIC_CORRECTION_MODE: ${AUTOMATIC_CORRECTION_MODE:-OFF}
      # Batch disparado pela tela /batch: subprocesso local com a credencial propria do batch.
      BATCH_RUNNER: ${BATCH_RUNNER:-local_process}
      BATCH_DATABASE_URL: postgresql+psycopg://batch_user:${BATCH_DB_PASSWORD:-local_only_batch}@db:5432/${POSTGRES_DB:-vx_materiais}
      PDM_WORKBOOK_PATH: /data/desafio01/03_padrao_cadastro_PDM.xlsx
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /storage
    volumes:
      - ./data:/data:ro
      - storage-data:/storage
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      agent:
        condition: service_healthy

  # Aplicação autorizada pela política do servidor, com ator SYSTEM e credenciais da API.
  automatic-corrections:
    init: true
    stop_grace_period: 30s
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTHORIZED_CENTER_CODES: ${AUTHORIZED_CENTER_CODES:-1100,1200,1300,2100,2200,9000}
      AUTOMATIC_CORRECTION_MODE: ${AUTOMATIC_CORRECTION_MODE:-OFF}
      DATABASE_URL: postgresql+psycopg://api_user:${API_DB_PASSWORD:-local_only_api}@db:5432/${POSTGRES_DB:-vx_materiais}
      BATCH_DATABASE_URL: postgresql+psycopg://batch_user:${BATCH_DB_PASSWORD:-local_only_batch}@db:5432/${POSTGRES_DB:-vx_materiais}
      PDM_WORKBOOK_PATH: /data/desafio01/03_padrao_cadastro_PDM.xlsx
    command: ["vx-auto-correct"]
    # Worker sem HTTP: verifica a conexão de aplicação, sem herdar o teste HTTP da imagem.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          from vx_materials_api.db.session import make_engine
          engine = make_engine()
          with engine.connect() as connection:
              connection.exec_driver_sql("SELECT 1")
          engine.dispose()
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./data:/data:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      index:
        condition: service_healthy

  # Sem portas publicadas: acessivel somente pela API.
  agent:
    init: true
    stop_grace_period: 15s
    cpus: ${AGENT_CPUS:-1}
    mem_limit: ${AGENT_MEMORY_LIMIT:-512m}
    pids_limit: ${AGENT_PIDS_LIMIT:-64}
    build:
      context: .
      target: agent
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_MAX_CONCURRENT_TURNS: ${AGENT_MAX_CONCURRENT_TURNS:-2}
      DATABASE_URL: postgresql+psycopg://mcp_reader:${MCP_DB_PASSWORD:-local_only_mcp}@db:5432/${POSTGRES_DB:-vx_materiais}
      PDM_WORKBOOK_PATH: /data/desafio01/03_padrao_cadastro_PDM.xlsx
      AGENT_INTERNAL_TOKEN_SECRET: ${AGENT_INTERNAL_TOKEN_SECRET:-local_only_agent_internal_token_secret}
    volumes:
      - ./data:/data:ro
    depends_on:
      index:
        condition: service_healthy

  batch:
    init: true
    profiles: [batch]
    build:
      context: .
      target: batch
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://batch_user:${BATCH_DB_PASSWORD:-local_only_batch}@db:5432/${POSTGRES_DB:-vx_materiais}
      PDM_WORKBOOK_PATH: /data/desafio01/03_padrao_cadastro_PDM.xlsx
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /storage
      S3_BUCKET: ${S3_BUCKET:-}
    command: ["sh", "-c", "vx-back index && vx-back sanitize"]
    volumes:
      - ./data:/data:ro
      - storage-data:/storage
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Reset da demo: apaga o estado operacional e recria o inicial. Exige DEMO_MODE=true e o nome do banco.
  # DEMO_MODE=true docker compose --profile demo run --rm demo reset --confirm vx_materiais
  demo:
    profiles: [demo]
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      MIGRATION_DATABASE_URL: postgresql+psycopg://migration_user:${MIGRATION_DB_PASSWORD:-local_only_migration}@db:5432/${POSTGRES_DB:-vx_materiais}
      DATA_DIR: /data/desafio01
      PDM_WORKBOOK_PATH: /data/desafio01/03_padrao_cadastro_PDM.xlsx
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /storage
      S3_BUCKET: ${S3_BUCKET:-}
    entrypoint: ["vx-demo"]
    command: ["status"]
    volumes:
      - ./data:/data:ro
      - storage-data:/storage
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Modelo de embeddings local, opcional: docker compose --profile embeddings up -d embeddings
  embeddings:
    profiles: [embeddings]
    image: ollama/ollama:0.12.3
    volumes:
      - embedding-models:/root/.ollama

volumes:
  db-data:
  storage-data:
  embedding-models:
